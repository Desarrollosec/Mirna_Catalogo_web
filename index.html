<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Ingresos | Piso de Tienda</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-blue: #801e1e;     
            --soft-blue: #faeaea;        
            --border-blue: #e8caca;      
            --text-dark: #2d3436;        
            --text-gray: #636e72;        
            --bg-page: #f4f7f6;          
            --bg-white: #ffffff;         
            --accent-red: #d63031;       
            --admin-purple: #6c5ce7;
            --success-green: #27ae60;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg-page); color: var(--text-dark); line-height: 1.6; }

        .web-header {
            display: flex; flex-direction: column; align-items: center; padding: 40px 20px 20px;
            background-color: var(--bg-white); border-bottom: 1px solid #dfe6e9; margin-bottom: 30px;
        }
        .web-header h1 { font-weight: 600; font-size: 24px; color: var(--primary-blue); text-transform: uppercase; letter-spacing: 1px; margin-top: 10px; }

        .controls-wrapper {
            max-width: 1200px; margin: 0 auto; padding: 0 20px; display: flex; flex-direction: column; align-items: center; gap: 15px; margin-bottom: 40px;
        }

        .btn-sync {
            background-color: white; color: var(--primary-blue); border: 2px solid var(--border-blue);
            padding: 10px 15px; border-radius: 50px; font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 600;
            cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
        }
        .btn-sync:hover { background-color: var(--soft-blue); border-color: var(--primary-blue); }

        .filter-tabs { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; width: 100%; margin-bottom: 15px; }
        .tab-btn {
            background-color: var(--bg-white); color: var(--text-dark); border: 2px solid #dfe6e9;
            padding: 10px 25px; border-radius: 30px; font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 600;
            cursor: pointer; transition: all 0.2s ease;
        }
        .tab-btn:hover { background-color: #f1f2f6; }
        .tab-btn.active { background-color: var(--primary-blue); color: white; border-color: var(--primary-blue); box-shadow: 0 4px 10px rgba(128,30,30,0.2); }

        .categories { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 5px; width: 100%; }
        .cat-btn {
            background-color: var(--bg-white); color: var(--text-gray); border: 1px solid #dfe6e9;
            padding: 8px 20px; border-radius: 20px; font-family: 'Poppins', sans-serif; font-size: 13px; font-weight: 500;
            cursor: pointer; transition: all 0.2s ease;
        }
        .cat-btn:hover { background-color: var(--soft-blue); color: var(--primary-blue); border-color: var(--border-blue); }
        .cat-btn.active { background-color: var(--primary-blue); color: white; border-color: var(--primary-blue); }

        .admin-panel {
            width: 100%; max-width: 600px; background-color: white; border: 2px dashed var(--admin-purple);
            border-radius: 12px; padding: 20px; margin-top: 20px; display: none; flex-direction: column; gap: 15px;
            animation: fadeIn 0.3s ease-in-out;
        }
        .admin-title { text-align: center; color: var(--admin-purple); font-size: 16px; font-weight: 700; margin-bottom: 5px; }
        .admin-buttons { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        
        .btn-admin {
            background-color: white; color: var(--admin-purple); border: 1px solid var(--admin-purple);
            padding: 8px 16px; border-radius: 6px; font-family: 'Poppins', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s;
        }
        .btn-admin:hover { background-color: var(--admin-purple); color: white; }
        
        .btn-admin-master {
            background-color: var(--admin-purple); color: white; border: none; padding: 10px 20px; border-radius: 6px;
            font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer; transition: 0.2s; width: 100%; box-shadow: 0 4px 10px rgba(108, 92, 231, 0.3);
        }
        .btn-admin-master:hover { background-color: #5b4bc4; transform: translateY(-2px); }

        .admin-status { text-align: center; font-size: 13px; font-weight: 500; color: var(--text-gray); min-height: 20px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        .a4-sheet {
            max-width: 210mm; margin: 0 auto; background-color: var(--bg-white); box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            min-height: 297mm; background-size: cover; background-position: top center; background-repeat: no-repeat;
            display: flex; flex-direction: column;
        }
        .catalog-header-img { width: 100%; height: auto; display: block; background-color: var(--primary-blue); }
        .catalog-footer-img { width: 100%; height: auto; display: block; margin-top: auto; background-color: var(--text-dark); }
        .catalog-container { padding: 30px 40px; flex-grow: 1; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 25px; }

        @media (max-width: 768px) { .grid { grid-template-columns: repeat(2, 1fr); } .a4-sheet { max-width: 100%; } }
        @media (max-width: 480px) { .grid { grid-template-columns: 1fr; } }

        .product-card {
            background: var(--bg-white); border-radius: 12px; padding: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.04); 
            border: 1px solid #f1f2f6; display: flex; flex-direction: column; page-break-inside: avoid; position: relative;
        }
        .photo-frame {
            width: 100%; aspect-ratio: 1 / 1; height: auto; border: 2px solid var(--primary-blue); border-radius: 8px; padding: 4px;
            margin-bottom: 15px; background-color: #ffffff; display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        .photo-frame img { width: 100%; height: 100%; object-fit: contain; border-radius: 4px; }
        .product-info { display: flex; flex-direction: column; flex-grow: 1; padding: 0 2px; }
        .product-category { font-size: 10px; font-weight: 700; color: var(--primary-blue); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
        .product-sku { font-size: 11px; font-weight: 600; color: #b2bec3; margin-bottom: 6px; }
        .product-title { font-size: 15px; font-weight: 700; color: var(--text-dark); margin-bottom: 6px; line-height: 1.2; }
        .product-obs { font-size: 12px; color: var(--accent-red); margin-bottom: 10px; font-weight: 500; background-color: #fff5f5; padding: 6px; border-radius: 4px; border-left: 3px solid var(--accent-red); }
        .product-bulto { font-size: 13px; font-weight: 600; color: var(--primary-blue); background-color: var(--soft-blue); padding: 6px 10px; border-radius: 4px; margin-top: auto; border-left: 3px solid var(--primary-blue); }

        .status-message { text-align: center; grid-column: 1 / -1; padding: 40px; color: var(--text-gray); font-size: 16px; }

        @media print {
            body { background-color: white; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            .web-header, .controls-wrapper, .admin-panel { display: none !important; }
            .a4-sheet { box-shadow: none; max-width: 100%; width: 100%; margin: 0; padding: 0; }
            .grid { grid-template-columns: repeat(3, 1fr) !important; gap: 15px !important; }
            .product-card { border: 1px solid #dfe6e9 !important; break-inside: avoid; page-break-inside: avoid; }
            @page { size: A4; margin: 10mm; }
        }
    </style>
</head>
<body>

    <header class="web-header">
        <div class="logo-container">
            <img src="http://googleusercontent.com/image_collection/image_retrieval/8490127715225572213_0" alt="Logo" onerror="this.src='https://via.placeholder.com/250x80/ffffff/801e1e?text=LOGO'">
        </div>
        <h1>Nuevos Ingresos</h1>
    </header>

    <div class="controls-wrapper">
        
        <div class="filter-tabs" id="filterTabs">
            <button id="btnModeGeneral" class="tab-btn active" onclick="switchMode('general')">Catálogo General</button>
            <button id="btnModeCategoria" class="tab-btn" onclick="switchMode('categoria')">Buscar por Categoría</button>
            <button id="btnModeArchivo" class="tab-btn" onclick="switchMode('archivo')">Buscar por Archivo</button>
        </div>

        <div class="categories" id="filterContainer"></div>
        
        <div style="display: flex; gap: 10px; width: 100%; max-width: 600px; margin-top: 15px;">
            <button class="btn-sync" onclick="loadData()" style="flex: 1;">
                <span id="syncText">Actualizar</span>
            </button>
            <button class="btn-sync" onclick="imprimirCatalogo()" style="flex: 1; border-color: var(--primary-blue); color: var(--primary-blue);">
                📄 PDF
            </button>
            <button class="btn-sync" onclick="compartirCatalogo()" style="flex: 1; border-color: var(--success-green); color: var(--success-green);">
                🔗 Compartir
            </button>
            <button class="btn-sync" onclick="toggleAdminPanel()" style="flex: 1; border-color: var(--admin-purple); color: var(--admin-purple);">
                ⚙️ Admin
            </button>
        </div>

        <div class="admin-panel" id="adminPanel">
            <div class="admin-title">Panel de Sincronización Backend</div>
            <div class="admin-buttons">
                <button class="btn-admin" onclick="triggerBackend('automatizarConversionExcel', 'Convirtiendo archivos de Excel a formato Google...')">1. Convertir Excels</button>
                <button class="btn-admin" onclick="triggerBackend('procesarFotosDriveAImgBB', 'Subiendo fotos faltantes (Puede tomar minutos)...')">2. Procesar Fotos a Links</button>
                <button class="btn-admin" onclick="triggerBackend('ejecutarReporteManual', 'Haciendo barrido y generando reporte...')">3. Actualizar Reporte</button>
            </div>
            <button class="btn-admin-master" onclick="triggerBackend('ejecutarSincronizacionTotal', 'Iniciando ciclo maestro...')">⚡ Ejecutar Sincronización Total</button>
            <div class="admin-status" id="adminStatus">Esperando instrucciones...</div>
        </div>
    </div>

    <div class="a4-sheet" id="a4Sheet">
        <img id="catalogHeader" src="cabecera_local.jpg" class="catalog-header-img" alt="Cabecera" onerror="this.src='https://placehold.co/2480x350/801e1e/ffffff?text=Banner'">
        <div class="catalog-container">
            <div class="grid" id="productGrid">
                <div class="status-message">Descargando datos del servidor...</div>
            </div>
        </div>
        <img id="catalogFooter" src="pie_local.jpg" class="catalog-footer-img" alt="Pie" onerror="this.src='https://placehold.co/2480x200/2d3436/ffffff?text=Footer'">
    </div>

    <script>
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSxFbafMVZW4D1uok55e5sZyTcuWIXxDMFHoQuknZeE77l29zWbHmc6CtWps7CKmmAWgfP0maKRIB9e/pub?output=tsv'; 
        
        let allProducts = [];
        let categorySettings = {}; 
        
        let listCategories = new Set();
        let listFiles = new Set();
        
        let currentMode = 'general'; 
        let currentFilterValue = '';

        window.onload = function() {
            loadData();
        };

        function switchMode(mode) {
            currentMode = mode;
            currentFilterValue = '';
            
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btnMode' + mode.charAt(0).toUpperCase() + mode.slice(1)).classList.add('active');

            const container = document.getElementById('filterContainer');
            container.innerHTML = '';

            if (mode === 'general') {
                applyTheme('general');
                renderProducts(allProducts);
            } else if (mode === 'categoria') {
                Array.from(listCategories).filter(c => c !== "").sort().forEach(cat => {
                    container.innerHTML += `<button class="cat-btn" onclick="applyFilter('category', '${cat}', this)">${cat}</button>`;
                });
                document.getElementById('productGrid').innerHTML = '<div class="status-message">👆 Selecciona una Categoría arriba para ver los productos.</div>';
            } else if (mode === 'archivo') {
                Array.from(listFiles).filter(f => f !== "").sort().forEach(file => {
                    container.innerHTML += `<button class="cat-btn" onclick="applyFilter('file', '${file}', this)">${file}</button>`;
                });
                document.getElementById('productGrid').innerHTML = '<div class="status-message">👆 Selecciona un Archivo arriba para ver los productos.</div>';
            }
        }

        function applyFilter(type, value, btnElement) {
            currentFilterValue = value;
            
            if(btnElement) {
                document.querySelectorAll('#filterContainer .cat-btn').forEach(b => b.classList.remove('active'));
                btnElement.classList.add('active');
            }

            let filtered = [];
            if (type === 'category') {
                applyTheme(value);
                filtered = allProducts.filter(p => p.category === value);
            } else if (type === 'file') {
                applyTheme('general'); 
                filtered = allProducts.filter(p => p.file === value);
            }
            renderProducts(filtered);
        }

        function compartirCatalogo() {
            let baseUrl = window.location.href.split('?')[0];
            let shareUrl = baseUrl + "?view=cliente";
            
            if (currentMode === 'categoria' && currentFilterValue !== '') {
                shareUrl += "&type=cat&val=" + encodeURIComponent(currentFilterValue);
            } else if (currentMode === 'archivo' && currentFilterValue !== '') {
                shareUrl += "&type=file&val=" + encodeURIComponent(currentFilterValue);
            } else if (currentMode === 'general') {
                
            } else {
                alert("Primero selecciona la categoría o archivo específico que deseas compartir.");
                return;
            }

            navigator.clipboard.writeText(shareUrl).then(() => {
                alert("✅ ¡Micro-Link Copiado!\n\nPuedes pegarlo en WhatsApp. El cliente solo verá la selección actual sin los botones de administración.");
            }).catch(err => {
                prompt("Copia este enlace manualmente:", shareUrl);
            });
        }

        async function loadData() {
            const btnText = document.getElementById('syncText');
            if(btnText) btnText.innerText = "Descargando...";
            
            try {
                const cacheBuster = `&v=${new Date().getTime()}`;
                const response = await fetch(SHEET_URL + cacheBuster);
                if (!response.ok) throw new Error("No se pudo leer el archivo");
                
                const data = await response.text();
                parseTSV(data);
                
                if(btnText) btnText.innerText = "Actualizar";

            } catch (error) {
                if(btnText) btnText.innerText = "Error";
                setTimeout(() => { if(btnText) btnText.innerText = "Actualizar"; }, 3000);
            }
        }

        function parseTSV(data) {
            const rows = data.split('\n');
            allProducts = [];
            listCategories = new Set();
            listFiles = new Set();
            categorySettings = {}; 
            
            for(let i = 1; i < rows.length; i++) {
                const cols = rows[i].split('\t');
                if(cols.length >= 4 && cols[1] !== undefined && cols[1].trim() !== "") {
                    const product = {
                        image: cols[1] ? cols[1].trim() : '',       
                        category: cols[2] ? cols[2].trim() : '',    
                        title: cols[3] ? cols[3].trim() : '',       
                        file: cols[4] ? cols[4].trim() : '', 
                        obs: cols[5] ? cols[5].trim() : '',         
                        cantidadBulto: cols[6] ? cols[6].trim() : '', 
                        sku: cols[7] ? cols[7].trim() : ''          
                    };
                    allProducts.push(product);
                    
                    if(product.category) listCategories.add(product.category);
                    if(product.file) listFiles.add(product.file);

                    if (product.category && !categorySettings[product.category]) {
                        if ((cols[8] && cols[8].trim()) || (cols[9] && cols[9].trim()) || (cols[10] && cols[10].trim())) {
                            categorySettings[product.category] = {
                                header: cols[8] ? cols[8].trim() : '',
                                footer: cols[9] ? cols[9].trim() : '',
                                bg: cols[10] ? cols[10].trim() : ''
                            };
                        }
                    }
                }
            }
            
            checkClientView();
        }

        function checkClientView() {
            const urlParams = new URLSearchParams(window.location.search);
            const isClientView = urlParams.get('view') === 'cliente';
            
            if (isClientView) {
                document.querySelector('.controls-wrapper').style.display = 'none';
                document.querySelector('.web-header').style.display = 'none';
                
                const filterType = urlParams.get('type');
                const filterVal = urlParams.get('val');

                if (filterType === 'cat' && filterVal) {
                    applyTheme(filterVal);
                    renderProducts(allProducts.filter(p => p.category === filterVal));
                } else if (filterType === 'file' && filterVal) {
                    applyTheme('general');
                    renderProducts(allProducts.filter(p => p.file === filterVal));
                } else {
                    applyTheme('general');
                    renderProducts(allProducts);
                }
            } else {
                if (currentFilterValue !== '') {
                    const typeToApply = currentMode === 'categoria' ? 'category' : 'file';
                    applyFilter(typeToApply, currentFilterValue, null);
                } else {
                    switchMode(currentMode);
                }
            }
        }

        function applyTheme(category) {
            const sheet = document.getElementById('a4Sheet');
            const header = document.getElementById('catalogHeader');
            const footer = document.getElementById('catalogFooter');
            let headerSrc = 'cabecera_local.jpg';
            let footerSrc = 'pie_local.jpg';
            let bgImg = 'none';

            if (category !== 'general' && categorySettings[category]) {
                if (categorySettings[category].header) headerSrc = categorySettings[category].header;
                if (categorySettings[category].footer) footerSrc = categorySettings[category].footer;
                if (categorySettings[category].bg) bgImg = `url('${categorySettings[category].bg}')`;
            }
            header.src = headerSrc;
            footer.src = footerSrc;
            sheet.style.backgroundImage = bgImg;
        }

        function renderProducts(products) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            
            if(products.length === 0) {
                grid.innerHTML = '<div class="status-message">No hay productos para mostrar.</div>';
                return;
            }

            products.forEach(p => {
                const categoryHTML = p.category ? `<div class="product-category">${p.category}</div>` : '';
                const skuHTML = p.sku ? `<div class="product-sku">SKU: ${p.sku}</div>` : '';
                const titleHTML = p.title ? `<div class="product-title">${p.title}</div>` : '';
                const obsHTML = p.obs ? `<div class="product-obs">📌 ${p.obs}</div>` : '';
                const bultoHTML = p.cantidadBulto ? `<div class="product-bulto">📦 Bulto: ${p.cantidadBulto} u.</div>` : '';
                
                grid.innerHTML += `
                    <div class="product-card">
                        <div class="photo-frame">
                            <img src="${p.image}" alt="Producto" onerror="this.src='https://placehold.co/300x300/f1f2f6/a4b0be?text=Sin+Imagen'">
                        </div>
                        <div class="product-info">
                            ${categoryHTML}
                            ${skuHTML}
                            ${titleHTML}
                            ${obsHTML}
                            ${bultoHTML}
                        </div>
                    </div>
                `;
            });
        }

        function imprimirCatalogo() {
            if (allProducts.length === 0) {
                alert("Primero debes cargar el catálogo para poder exportarlo.");
                return;
            }
            window.print();
        }

        function toggleAdminPanel() {
            const panel = document.getElementById('adminPanel');
            if (panel.style.display === 'flex') {
                panel.style.display = 'none';
                return;
            }
            const password = prompt("Seguridad Mirna: Ingresa la clave de administrador para acceder a los controles.");
            if (password === "Catalago123") {
                panel.style.display = 'flex';
            } else if (password !== null) { 
                alert("Clave incorrecta. Acceso denegado.");
            }
        }

        function triggerBackend(functionName, loadingMessage) {
            const statusDiv = document.getElementById('adminStatus');
            statusDiv.innerHTML = `⏳ <b>Procesando:</b> ${loadingMessage}`;
            
            if (typeof google !== 'undefined' && google.script) {
                document.querySelectorAll('.admin-panel button').forEach(b => b.disabled = true);
                google.script.run
                    .withSuccessHandler(function(response) {
                        statusDiv.innerHTML = `✅ <b>¡Éxito!</b> Tarea completada.`;
                        document.querySelectorAll('.admin-panel button').forEach(b => b.disabled = false);
                        loadData(); 
                    })
                    .withFailureHandler(function(error) {
                        statusDiv.innerHTML = `❌ <b>Error:</b> ${error.message} (Intenta nuevamente)`;
                        document.querySelectorAll('.admin-panel button').forEach(b => b.disabled = false);
                    })
                    [functionName](); 
            } else {
                statusDiv.innerHTML = `⚠️ <b>Error de Entorno:</b> La web debe estar desplegada como una 'Aplicación Web'.`;
            }
        }
    </script>
</body>
</html>
